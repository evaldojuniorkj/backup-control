name: backup-control
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: backupcontrol
      POSTGRES_USER: backupcontrol
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U backupcontrol -d backupcontrol']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  api:
    build: ./api
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Database: Host=db;Database=backupcontrol;Username=backupcontrol;Password=${POSTGRES_PASSWORD}
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Configure .env}
    volumes:
      - api-keys:/app/keys
      - ./artifacts/distribution:/app/distribution:ro
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  web:
    build: ./web
    ports:
      - '127.0.0.1:${WEB_PORT:-5180}:80'
    depends_on:
      - api
    restart: unless-stopped
networks:
  default:
    enable_ipv6: true
volumes:
  postgres-data:
  api-keys:
